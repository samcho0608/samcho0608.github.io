name: Publish Next Scheduled Post

on:
  schedule:
    # Every 2 days at 9:00 AM UTC (오후 6시 KST)
    - cron: '0 0 */2 * *'
  workflow_dispatch:
    # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.queue.outputs.has_next }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check publish queue
        id: queue
        run: |
          if [ ! -f PUBLISH_QUEUE.txt ] || [ ! -s PUBLISH_QUEUE.txt ]; then
            echo "📭 Publish queue is empty — nothing to do."
            echo "has_next=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          NEXT=$(head -n 1 PUBLISH_QUEUE.txt)
          echo "next_files=$NEXT" >> $GITHUB_OUTPUT
          echo "has_next=true" >> $GITHUB_OUTPUT
          echo "📬 Next to publish: $NEXT"

      - name: "Set draft: false"
        if: steps.queue.outputs.has_next == 'true'
        run: |
          for FILE in ${{ steps.queue.outputs.next_files }}; do
            if [ -f "$FILE" ]; then
              sed -i 's/^draft: true$/draft: false/' "$FILE"
              echo "✅ Published: $FILE"
            else
              echo "⚠️  File not found: $FILE"
            fi
          done

      - name: Remove published entry from queue
        if: steps.queue.outputs.has_next == 'true'
        run: |
          tail -n +2 PUBLISH_QUEUE.txt > PUBLISH_QUEUE.tmp
          mv PUBLISH_QUEUE.tmp PUBLISH_QUEUE.txt
          echo "📋 Remaining queue:"
          cat PUBLISH_QUEUE.txt || echo "(empty)"

      - name: Commit and push
        if: steps.queue.outputs.has_next == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PUBLISH_QUEUE.txt ${{ steps.queue.outputs.next_files }}
          git commit -m "chore: publish scheduled post"
          git push

  # Reuse deploy.yml directly after publishing
  deploy:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    uses: ./.github/workflows/deploy.yml
